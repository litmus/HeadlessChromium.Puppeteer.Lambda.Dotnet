version: 2
updates:
- package-ecosystem: nuget
  directories:
    - "/sample/SampleLambda-dotnet6"
    - "/sample/SampleLambda-dotnet7"
    - "/sample/SampleLambda-dotnet8"
  schedule:
    interval: daily
    time: "04:00"
  rebase-strategy: disabled
  ignore:
    - dependency-name: "HeadlessChromium.Puppeteer.Lambda.Dotnet"
- package-ecosystem: nuget
  directory: "/src/HeadlessChromium.Puppeteer.Lambda.Dotnet"
  schedule:
    interval: daily
    time: "04:00"
  rebase-strategy: disabled
  ignore:
    - dependency-name: "PuppeteerSharp"
    - dependency-name: "Microsoft.Extensions.Logging"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  rebase-strategy: disabled


- package-ecosystem: "github-actions"
  open-pull-requests-limit: 5
  directory: "/"
  schedule:
    interval: "weekly"
    day: wednesday
    time: "00:00"
    timezone: America/Chicago
  commit-message:
    prefix: ci
